[package]
name = "pillreserves"
version = "0.1.0"
edition = "2021"

[dependencies]
askama = { version = "0.16" }
chrono = { version = "0.4" }
derive-new = { version = "0.7" }
form_urlencoded = { version = "1.2" }
http = { version = "1.5" }
http-body-util = { version = "0.1" }
hyper = { version = "1.11", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "tokio"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = { version = "0.2" }
regex = { version = "1.13" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread"] }
toml = { version = "1.1" }
url = { version = "2.5" }
